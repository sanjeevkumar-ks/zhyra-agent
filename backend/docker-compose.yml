version: '3.8'

services:
  app:
    build: .
    container_name: atlas-api-app
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    env_file:
      - .env
    depends_on:
      - qdrant
    networks:
      - atlas-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atlas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - atlas-network

volumes:
  qdrant_storage:

networks:
  atlas-network:
    driver: bridge
